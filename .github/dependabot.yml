version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      runtime:
        dependency-type: "production"
        exclude-patterns:
          - "ccbr_tools"
      build:
        patterns:
          - "ccbr_tools"
          - "setuptools"
          - "setuptools-scm"
          - "wheel"
      dev:
        dependency-type: "development"
    cooldown:
      default-days: 7
